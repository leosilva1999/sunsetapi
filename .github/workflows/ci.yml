name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Sunset.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit.trx"

      # The runner ships with Docker, which Testcontainers uses to start a real PostgreSQL 16
      # (full-text search and the Haversine "near me" query have no in-memory equivalent).
      - name: Integration tests
        run: dotnet test tests/Sunset.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      # Failed tests become annotations on the run (readable without logging in), so a red build says
      # which tests broke and why instead of only "exit code 1".
      - name: Annotate failed tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          def esc(text):
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          failed = 0
          for path in glob.glob('**/TestResults/*.trx', recursive=True):
              for result in ET.parse(path).getroot().iter('{%s}UnitTestResult' % ns['t']):
                  if result.get('outcome') != 'Failed':
                      continue
                  failed += 1
                  info = result.find('t:Output/t:ErrorInfo', ns)
                  message = (info.findtext('t:Message', default='', namespaces=ns) if info is not None else '').strip()
                  stack = (info.findtext('t:StackTrace', default='', namespaces=ns) if info is not None else '').strip()
                  detail = (message + '\n' + '\n'.join(stack.splitlines()[:4]))[:900]
                  print('::error title=%s::%s' % (esc(result.get('testName', '?')), esc(detail)))
          print('%d failed test(s)' % failed)
          PY
