name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Sunset.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit.trx"

      # The runner ships with Docker, which Testcontainers uses to start a real PostgreSQL 16
      # (full-text search and the Haversine "near me" query have no in-memory equivalent).
      - name: Integration tests
        run: dotnet test tests/Sunset.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
